[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mmd-fraud"
version = "0.1.0"
description = "Separate financial graph domains with reproducible cloud analytics"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
spark = ["pyspark==4.0.1", "py4j==0.10.9.9"]
dev = ["pytest==8.4.2", "ruff==0.13.3"]
cloud = ["numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.7.2",
         "joblib==1.5.2", "threadpoolctl==3.6.0", "pyarrow==20.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
