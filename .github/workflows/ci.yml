name: Cloud compatibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-cloud.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - env:
          MMDS_TEST_REPORT_DIRECTORY: ${{ runner.temp }}/mmds-evidence
        run: |
          mkdir -p "$RUNNER_TEMP/mmds-evidence"
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/mmds-evidence/pytest.log"
      - run: python scripts/spark_smoke.py
      - if: always()
        run: python scripts/prepare_ci_evidence.py --directory "$RUNNER_TEMP/mmds-evidence" --output "$RUNNER_TEMP/mmds-public"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-evidence-python-${{ matrix.python }}
          path: ${{ runner.temp }}/mmds-public
          retention-days: 7
  real-release:
    # Public GitHub-hosted Linux only; no paid/self-hosted runners or private artifacts.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-cloud.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Bounded authorized release acquisition and validation
        run: |
          mkdir -p "$RUNNER_TEMP/mmds-evidence"
          python scripts/check_mirror.py --report "$RUNNER_TEMP/mmds-evidence/real-release.json" --destination "$RUNNER_TEMP/mmds-private/raw"
      - if: always()
        run: python scripts/prepare_ci_evidence.py --directory "$RUNNER_TEMP/mmds-evidence" --output "$RUNNER_TEMP/mmds-public"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-release-validation
          path: ${{ runner.temp }}/mmds-public
          retention-days: 7
      - if: always()
        name: Remove private runtime datasets
        run: rm -rf -- "$RUNNER_TEMP/mmds-private"
