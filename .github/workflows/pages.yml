name: Static dashboard and GitHub Pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'dashboard/data/**', 'docs/**', 'scripts/export_pages_data.py', 'src/mmd_fraud/evidence.py', 'src/mmd_fraud/dashboard_graph.py', 'src/mmd_fraud/report_links.py', 'requirements-dashboard.lock', '.github/workflows/pages.yml']
  pull_request:
    paths: ['frontend/**', 'dashboard/data/**', 'docs/**', 'scripts/export_pages_data.py', 'tests/test_pages_export.py', 'src/mmd_fraud/evidence.py', 'src/mmd_fraud/dashboard_graph.py', 'src/mmd_fraud/report_links.py', 'requirements-dashboard.lock', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dashboard.lock
      - name: Validate source evidence and export only allowlisted public assets
        run: python scripts/export_pages_data.py
      - name: Reproducible install without dependency lifecycle scripts
        run: npm ci --ignore-scripts --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend --audit-level=moderate
      - name: Real browser validation at /MMDS/, including mobile and failure states
        run: npm run test:browser --prefix frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-dashboard-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'ojassgambira/MMDS' && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - if: failure()
        name: Explain missing Pages authorization
        run: |
          echo '::error::If Pages is not enabled, a repository owner must select Settings > Pages > Source > GitHub Actions once. The connected tools and ordinary GITHUB_TOKEN cannot grant this administration setting. No PAT or paid service is needed.'
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --prefix frontend
      - name: Verify actual public URL, deployed commit and browser functionality
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node frontend/tests/verify-live.mjs
      - name: Download the verified build artifact for frozen browser expectations
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/expected-pages
      - name: Restore only published aggregate expectations
        run: |
          mkdir -p "$RUNNER_TEMP/expected-site" frontend/public
          tar --extract --file "$RUNNER_TEMP/expected-pages/artifact.tar" --directory "$RUNNER_TEMP/expected-site" --no-same-owner --no-same-permissions
          cp -R "$RUNNER_TEMP/expected-site/data" frontend/public/data
      - name: Live desktop/mobile interactions and automated accessibility
        env:
          MMDS_LIVE_URL: https://ojassgambira.github.io/MMDS/
        run: npm run test:browser --prefix frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-dashboard-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
